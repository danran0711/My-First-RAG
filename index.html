<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地知识库智能体</title>
<style>
  :root{
    --bg:#f0f2f5; --panel:#ffffff; --text:#1f2328; --text-dim:#6b7280;
    --border:#e3e6ea; --primary:#1a73e8; --primary-dark:#1557b0;
    --bot-bg:#ffffff; --user-bg:#1a73e8; --code-bg:#f6f8fa;
    --shadow:0 1px 3px rgba(0,0,0,.08);
    --hover:rgba(127,127,127,.10);
  }
  [data-theme="dark"]{
    --bg:#0f1216; --panel:#171b21; --text:#e6e8eb; --text-dim:#9aa4b2;
    --border:#262c34; --primary:#4c8dff; --primary-dark:#3a78e0;
    --bot-bg:#1c2229; --user-bg:#2f6fe0; --code-bg:#12161b;
    --shadow:0 1px 3px rgba(0,0,0,.45);
    --hover:rgba(255,255,255,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{ font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; -webkit-font-smoothing:antialiased; }
  .app{display:flex;height:100vh;height:100dvh}

  /* 侧边栏 */
  .sidebar{ width:260px;flex:0 0 260px;background:var(--panel);border-right:1px solid var(--border); display:flex;flex-direction:column;transition:transform .25s ease; }
  .sidebar-head{padding:14px 14px 12px;border-bottom:1px solid var(--border)}
  .brand{font-size:15px;font-weight:700;margin-bottom:12px;letter-spacing:.3px}
  .btn-new{ width:100%;padding:9px 12px;border:1px dashed var(--border);background:transparent; color:var(--text);border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;transition:.2s; }
  .btn-new:hover{border-color:var(--primary);color:var(--primary);background:var(--hover)}
  .session-list{flex:1;overflow-y:auto;padding:8px}
  .session-item{ display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px; cursor:pointer;font-size:14px;color:var(--text-dim);transition:background .15s; }
  .session-item:hover{background:var(--hover)}
  .session-item.active{background:rgba(26,115,232,.12);color:var(--primary);font-weight:600}
  .session-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .session-item .del{ border:none;background:none;color:inherit;cursor:pointer;font-size:12px; opacity:0;transition:opacity .15s;padding:2px 4px;border-radius:4px; }
  .session-item:hover .del{opacity:.6}
  .session-item .del:hover{opacity:1;color:#e5484d}
  .sidebar-foot{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
  .foot-btn{ padding:8px 11px;border:none;background:transparent;color:var(--text-dim); border-radius:8px;cursor:pointer;font-size:13px;text-align:left;font-family:inherit;transition:.15s; }
  .foot-btn:hover{background:var(--hover);color:var(--text)}

  /* 主区域 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .header{ height:56px;flex:0 0 56px;display:flex;align-items:center;gap:12px; padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border); }
  .header .title{flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon-btn{ border:none;background:transparent;color:var(--text-dim);cursor:pointer; font-size:16px;padding:6px 8px;border-radius:8px;transition:.15s;line-height:1; }
  .icon-btn:hover{background:var(--hover);color:var(--text)}
  .menu-btn{display:none}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);white-space:nowrap}
  .status i{width:7px;height:7px;border-radius:50%;background:#30a46c;display:inline-block}
  .status.busy i{background:#f5a524;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.25}}

  /* 聊天区 */
  .chat-box{flex:1;overflow-y:auto;padding:20px 16px 12px;scroll-behavior:smooth}
  .messages{max-width:840px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
  .row{display:flex;gap:10px;align-items:flex-start}
  .row.user{flex-direction:row-reverse}
  .avatar{ width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:flex; align-items:center;justify-content:center;font-size:12px;font-weight:600; background:var(--border);color:var(--text-dim);user-select:none; }
  .row.user .avatar{background:var(--user-bg);color:#fff}
  .row.bot .avatar{background:linear-gradient(135deg,#1a73e8,#4c8dff);color:#fff}
  .wrap{display:flex;flex-direction:column;gap:5px;max-width:min(76%,680px);min-width:0}
  .row.user .wrap{align-items:flex-end}
  .bubble{ padding:11px 15px;border-radius:16px;font-size:15px;line-height:1.72; word-wrap:break-word;overflow-wrap:anywhere; }
  .row.bot .bubble{background:var(--bot-bg);box-shadow:var(--shadow);border-top-left-radius:5px}
  .row.user .bubble{background:var(--user-bg);color:#fff;border-top-right-radius:5px;white-space:pre-wrap}
  .bubble.error{color:#e5484d;background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.25)}

  .tools{display:flex;gap:6px;opacity:0;transition:opacity .18s}
  .row:hover .tools{opacity:1}
  .tools button{ border:none;background:transparent;color:var(--text-dim);cursor:pointer; font-size:12px;padding:3px 8px;border-radius:6px;font-family:inherit;transition:.15s; }
  .tools button:hover{background:var(--hover);color:var(--primary)}

  .thinking{display:inline-flex;gap:5px;padding:3px 0}
  .thinking i{width:6px;height:6px;border-radius:50%;background:var(--text-dim);animation:bounce 1.3s infinite}
  .thinking i:nth-child(2){animation-delay:.15s}
  .thinking i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}

  .cursor{ display:inline-block;width:7px;height:15px;background:var(--primary); vertical-align:-2px;margin-left:2px;border-radius:2px;animation:blink 1s steps(1) infinite; }
  @keyframes blink{50%{opacity:0}}

  /* Markdown 样式 */
  .bubble p{margin:0 0 9px}
  .bubble p:last-child{margin-bottom:0}
  .bubble h1,.bubble h2,.bubble h3,.bubble h4,.bubble h5,.bubble h6{ margin:12px 0 7px;line-height:1.4;font-size:1.02em;font-weight:700; }
  .bubble ul,.bubble ol{margin:6px 0 9px;padding-left:22px}
  .bubble li{margin:3px 0}
  .bubble a{color:var(--primary);text-decoration:underline}
  .bubble blockquote{border-left:3px solid var(--border);margin:8px 0;padding:2px 12px;color:var(--text-dim)}
  .bubble hr{border:none;border-top:1px solid var(--border);margin:12px 0}
  .bubble code.ic{ background:var(--code-bg);border:1px solid var(--border);padding:1px 5px; border-radius:5px;font-family:ui-monospace,Consolas,monospace;font-size:.88em; }
  .bubble pre{ position:relative;background:var(--code-bg);border:1px solid var(--border); border-radius:10px;padding:13px 14px;overflow-x:auto;margin:9px 0; }
  .bubble pre code{font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.65;white-space:pre}

  /* 输入区 */
  .composer{padding:10px 16px 14px;background:var(--panel);border-top:1px solid var(--border)}
  .composer-inner{max-width:840px;margin:0 auto}
  .input-wrap{ display:flex;align-items:flex-end;gap:10px;background:var(--bg); border:1px solid var(--border);border-radius:16px;padding:8px 8px 8px 15px; transition:border-color .2s,box-shadow .2s; }
  .input-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,115,232,.12)}
  #msg{ flex:1;border:none;outline:none;background:transparent;resize:none; font-family:inherit;font-size:15px;line-height:1.5;color:var(--text); max-height:160px;padding:5px 0; }
  #msg::placeholder{color:var(--text-dim)}
  .send-btn{ padding:9px 22px;border:none;border-radius:12px;background:var(--primary);color:#fff; font-size:14px;font-family:inherit;cursor:pointer;transition:.18s;white-space:nowrap;flex:0 0 auto; }
  .send-btn:hover{background:var(--primary-dark)}
  .send-btn.stop{background:#e5484d}
  .hint{text-align:center;font-size:11px;color:var(--text-dim);margin-top:8px;opacity:.8}

  /* 遮罩与滚动 */
  .overlay{ position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0; pointer-events:none;transition:opacity .25s;z-index:55; }
  .overlay.show{opacity:1;pointer-events:auto}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(127,127,127,.28);border-radius:4px}

  @media (max-width:820px){
    .sidebar{position:fixed;inset:0 auto 0 0;z-index:60;transform:translateX(-100%);box-shadow:4px 0 24px rgba(0,0,0,.18)}
    .sidebar.open{transform:translateX(0)}
    .menu-btn{display:block}
    .wrap{max-width:calc(100% - 46px)}
  }
  @media (min-width:821px){ .overlay{display:none} }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">📚 知识库助手</div>
      <button class="btn-new" id="newChatBtn">＋ 新建对话</button>
    </div>
    <div class="session-list" id="sessionList"></div>
    <div class="sidebar-foot">
      <button class="foot-btn" id="themeBtn">🌙 深色模式</button>
      <button class="foot-btn" id="exportBtn">⬇ 导出当前对话</button>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="header">
      <button class="icon-btn menu-btn" id="menuBtn">☰</button>
      <div class="title">本地知识库智能体</div>
      <span class="status" id="status"><i></i>就绪</span>
      <button class="icon-btn" id="clearBtn" title="清空当前对话">🗑</button>
    </header>

    <div class="chat-box" id="chat">
      <div class="messages" id="messages"></div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <div class="input-wrap">
          <textarea id="msg" rows="1" placeholder="输入你的问题…（Enter 发送 / Shift+Enter 换行）"></textarea>
          <button class="send-btn" id="send">发送</button>
        </div>
        <div class="hint">回答基于本地知识库生成，仅供参考。</div>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  // 核心 DOM
  const el = {
    sidebar: document.getElementById('sidebar'), overlay: document.getElementById('overlay'),
    sessionList: document.getElementById('sessionList'), chat: document.getElementById('chat'),
    messages: document.getElementById('messages'), input: document.getElementById('msg'),
    send: document.getElementById('send'), themeBtn: document.getElementById('themeBtn'),
    newChatBtn: document.getElementById('newChatBtn'), exportBtn: document.getElementById('exportBtn'),
    clearBtn: document.getElementById('clearBtn'), menuBtn: document.getElementById('menuBtn'),
    status: document.getElementById('status')
  };

  // 状态
  let sessions = JSON.parse(localStorage.getItem('kb_sessions') || '[]');
  let currentId = null;
  let sending = false;

  // 工具
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const currentSession = () => sessions.find(s => s.id === currentId);
  const save = () => localStorage.setItem('kb_sessions', JSON.stringify(sessions));

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // 极简 Markdown 渲染（防崩版）
  function mdToHtml(text) {
    if (!text) return '';
    let html = escapeHtml(text);
    html = html.replace(/```([\\s\\S]*?)```/g, (m, code) => `<pre><code>${code.trim()}</code></pre>`);
    html = html.replace(/`([^`\\n]+)`/g, '<code class="ic">$1</code>');
    html = html.replace(/\\*\\*([^*]+)\\*\\*/g, '<strong>$1</strong>');
    html = html.replace(/\\n/g, '<br>');
    return html;
  }

  // 渲染
  function renderSessions() {
    el.sessionList.innerHTML = '';
    sessions.forEach(s => {
      const d = document.createElement('div');
      d.className = 'session-item' + (s.id === currentId ? ' active' : '');
      d.innerHTML = `<span class="t">${s.title || '新对话'}</span><button class="del">✕</button>`;
      
      d.onclick = (e) => {
        if (e.target.classList.contains('del')) {
          if (!confirm('确定删除这个对话吗？')) return;
          sessions = sessions.filter(x => x.id !== s.id);
          if (currentId === s.id) currentId = sessions[0]?.id;
          if (!sessions.length) newChat();
          else { save(); renderSessions(); renderMessages(); }
          return;
        }
        currentId = s.id; save(); renderSessions(); renderMessages(); closeSidebar();
      };
      el.sessionList.appendChild(d);
    });
  }

  function renderMessages() {
    el.messages.innerHTML = '';
    const s = currentSession();
    if (!s) return;

    if (!s.messages.length) {
      s.messages.push({ role: 'bot', content: '你好！知识库已就绪。请随时提问。' });
    }

    s.messages.forEach(m => {
      const row = document.createElement('div');
      row.className = 'row ' + m.role;
      const av = `<div class="avatar">${m.role === 'user' ? '我' : 'AI'}</div>`;
      
      let content = '';
      if (m.role === 'user') content = escapeHtml(m.content);
      else if (m.error) content = `<div class="bubble error">${escapeHtml(m.content)}</div>`;
      else content = `<div class="bubble">${mdToHtml(m.content)}</div>`;

      // 简单加上复制按钮
      let tools = '';
      if (m.role === 'bot' && !m.error) {
        tools = `<div class="tools"><button onclick="navigator.clipboard.writeText('${m.content.replace(/'/g, "\\\\'")}');alert('已复制')">复制</button></div>`;
      }
      
      row.innerHTML = av + `<div class="wrap">${content}${tools}</div>`;
      el.messages.appendChild(row);
    });
    el.chat.scrollTop = el.chat.scrollHeight;
  }

  // 发送逻辑（回归最纯粹、最稳的 POST /chat）
  async function send(text) {
    const s = currentSession();
    if (!s || sending) return;
    
    s.messages.push({ role: 'user', content: text });
    if (s.messages.filter(m => m.role === 'user').length === 1) {
      s.title = text.slice(0, 16);
    }
    s.messages.push({ role: 'bot', content: '', pending: true });
    
    save(); renderSessions(); renderMessages();
    sending = true;
    setUI(true);

    try {
      // 只传最基础的 message，杜绝后端解析出错
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      if (!res.ok) throw new Error(`服务器状态码 ${res.status}`);
      const data = await res.json();
      
      // 解析后端回复字段
      const reply = data.reply || data.answer || data.content || data.message || '（未找到回复字段）';
      
      // 模拟打字机效果显示
      await typewriter(s.messages[s.messages.length - 1], reply);
      
    } catch (err) {
      const lastMsg = s.messages[s.messages.length - 1];
      lastMsg.error = true;
      lastMsg.content = '请求失败: ' + err.message;
      renderMessages();
    } finally {
      sending = false;
      setUI(false);
      save();
    }
  }

  // 打字机效果（纯前端模拟，不依赖流式接口）
  function typewriter(msgObj, fullText) {
    return new Promise(resolve => {
      msgObj.pending = false;
      let i = 0;
      const timer = setInterval(() => {
        i += 5;
        msgObj.content = fullText.slice(0, i);
        renderMessages(); // 每次更新重新渲染
        if (i >= fullText.length) {
          clearInterval(timer);
          msgObj.content = fullText;
          renderMessages();
          resolve();
        }
      }, 20);
    });
  }

  function setUI(busy) {
    el.send.textContent = busy ? '等待...' : '发送';
    el.send.disabled = busy;
    el.status.innerHTML = busy ? '<i></i>思考中…' : '<i></i>就绪';
    el.status.classList.toggle('busy', busy);
  }

  // 绑定事件
  el.send.onclick = () => {
    const t = el.input.value.trim();
    if (!t || sending) return;
    el.input.value = ''; autoGrow();
    send(t);
  };

  el.input.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault(); el.send.click();
    }
  };

  const autoGrow = () => {
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, 160) + 'px';
  };
  el.input.oninput = autoGrow;

  function newChat() {
    const s = { id: uid(), title: '新对话', messages: [] };
    sessions.unshift(s); currentId = s.id;
    save(); renderSessions(); renderMessages(); closeSidebar();
  }

  el.newChatBtn.onclick = newChat;
  el.clearBtn.onclick = () => {
    if (confirm('清空当前对话？')) {
      currentSession().messages = []; save(); renderMessages();
    }
  };

  el.exportBtn.onclick = () => {
    const s = currentSession();
    const text = s.messages.map(m => `**${m.role === 'user' ? '我' : 'AI'}**:\\n${m.content}`).join('\\n\\n---\\n\\n');
    const blob = new Blob([text], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (s.title || '对话') + '.md';
    a.click();
  };

  // 暗黑模式
  el.themeBtn.onclick = () => {
    const isDark = document.documentElement.dataset.theme === 'dark';
    document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
    el.themeBtn.textContent = isDark ? '🌙 深色模式' : '☀️ 浅色模式';
    localStorage.setItem('kb_theme', isDark ? 'light' : 'dark');
  };
  if (localStorage.getItem('kb_theme') === 'dark') el.themeBtn.click();

  // 移动端菜单
  const closeSidebar = () => { el.sidebar.classList.remove('open'); el.overlay.classList.remove('show'); };
  el.menuBtn.onclick = () => { el.sidebar.classList.add('open'); el.overlay.classList.add('show'); };
  el.overlay.onclick = closeSidebar;

  // 初始化
  if (!sessions.length) newChat();
  else { currentId = sessions[0].id; renderSessions(); renderMessages(); }

})();
</script>
</body>
</html>
